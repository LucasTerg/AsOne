[package]
name = "asone-cli"
description = "AsOne bez okna: eksport paczek zdjęć, podgląd nazw, inspekcja, serwer MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "asone-cli"
path = "src/main.rs"

[features]
default = ["mozjpeg", "avif"]
avif = ["asone-core/avif"]
mozjpeg = ["asone-core/mozjpeg"]
nasm = ["asone-core/nasm"]

[dependencies]
asone-core = { workspace = true }
image = { workspace = true }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.22"
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
