# AsOne na wszystkie platformy.
#
# * push na `main` – samo budowanie (sprawdzenie, czy wszystko się kompiluje i pakuje),
# * tag `v*` (np. `git tag v0.1.1 && git push origin v0.1.1`) albo ręcznie (Actions › Release ›
#   Run workflow) – budowanie i GitHub Release z plikami.
# Przy błędzie końcówka logu trafia do adnotacji („Końcówka logu”) – widać ją bez logowania.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania (np. v0.1.0)"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (AppImage, Flatpak, tar.gz)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04, features: "--features asone/nasm,asone-cli/nasm" }
          - { arch: aarch64, os: ubuntu-24.04-arm, features: "" }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build.rs liczy statystyki z git log
      - name: Pakiety systemowe i runtime Flatpak
        run: |
          sudo apt-get update
          # librsvg2-common: flatpak build-export sprawdza ikonę SVG przez gdk-pixbuf.
          sudo apt-get install -y --no-install-recommends nasm pkg-config flatpak librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}
      - name: Budowanie, AppImage i Flatpak
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -o pipefail
          packaging/linux/package.sh all 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tar czf "dist/AsOne-$V-linux-${{ matrix.arch }}.tar.gz" -C target/release asone asone-cli
          df -h . | tail -n 1
      - name: Końcówka logu (przy błędzie)
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          clean="$RUNNER_TEMP/build-clean.log"
          sed 's/\x1b\[[0-9;]*m//g; s/\r//g' "$f" > "$clean"
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=Błędy z logu::$(grep -E '^error|error\[|[Ee]rror:|ERROR|failed|panicked|Undefined symbols|referenced from|ld: |^ +"?_' "$clean" | grep -v 'ld: warning' | tail -n 60 | enc)"
          echo "::error title=Końcówka logu::$(grep -v 'ld: warning' "$clean" | tail -n 60 | enc)"
          echo "::error title=Dysk::$(df -h . | tail -n 1)"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.flatpak
            dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x86_64 }
          - { target: aarch64-pc-windows-msvc, arch: arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Budowanie
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --target ${{ matrix.target }} -p asone -p asone-cli 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Końcówka logu (przy błędzie)
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          clean="$RUNNER_TEMP/build-clean.log"
          sed 's/\x1b\[[0-9;]*m//g; s/\r//g' "$f" > "$clean"
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=Błędy z logu::$(grep -E '^error|error\[|[Ee]rror:|ERROR|failed|panicked|Undefined symbols|referenced from|ld: |^ +"?_' "$clean" | grep -v 'ld: warning' | tail -n 60 | enc)"
          echo "::error title=Końcówka logu::$(grep -v 'ld: warning' "$clean" | tail -n 60 | enc)"
          echo "::error title=Dysk::$(df -h . | tail -n 1)"
      - name: Paczka ZIP
        shell: bash
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          OUT="AsOne-$V-windows-${{ matrix.arch }}"
          R="target/${{ matrix.target }}/release"
          mkdir -p "dist/$OUT"
          cp "$R/asone.exe" "$R/asone-cli.exe" README.md "dist/$OUT/"
          cp "$R"/*.dll "dist/$OUT/" 2>/dev/null || true
          ls -la "dist/$OUT"
          (cd dist && 7z a -tzip "$OUT.zip" "$OUT" > /dev/null)
      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimalny macOS = ten, dla którego zbudowany jest ONNX Runtime (arm64: pyke 13.4, Intel: PyPI 13.0).
          - { target: aarch64-apple-darwin, arch: arm64, min_macos: "13.4" }
          - { target: x86_64-apple-darwin, arch: x86_64, min_macos: "13.0" }
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_macos }}
      MIN_MACOS: ${{ matrix.min_macos }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Intel: gotowych binarek ONNX Runtime dla x86_64 macOS nie ma w `ort`; ostatnie oficjalne
      # (Microsoft, 1.23.2) są w kole Pythona na PyPI – stąd libonnxruntime.dylib, linkowana
      # dynamicznie i dołączana do AsOne.app.
      - name: ONNX Runtime 1.23.2 dla Intel (PyPI)
        if: matrix.arch == 'x86_64'
        run: |
          ORT="$RUNNER_TEMP/ort"
          mkdir -p "$ORT"
          URL=$(curl -fsSL https://pypi.org/pypi/onnxruntime/1.23.2/json | python3 -c '
          import json, sys
          files = json.load(sys.stdin)["urls"]
          print(next(f["url"] for f in files if "cp312" in f["filename"] and "macosx" in f["filename"] and "x86_64" in f["filename"]))')
          curl -fsSL -o "$RUNNER_TEMP/ort.whl" "$URL"
          unzip -j "$RUNNER_TEMP/ort.whl" "onnxruntime/capi/libonnxruntime.1.23.2.dylib" -d "$ORT"
          ln -sf libonnxruntime.1.23.2.dylib "$ORT/libonnxruntime.dylib"
          otool -D "$ORT/libonnxruntime.1.23.2.dylib"
          {
            echo "ORT_LIB_LOCATION=$ORT"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "EXTRA_DYLIBS=$ORT/libonnxruntime.1.23.2.dylib"
          } >> "$GITHUB_ENV"
      - name: Budowanie
        run: |
          set -o pipefail
          # -fapple-link-rtlib: ___isPlatformVersionAtLeast (@available w CoreML z ONNX Runtime) z compiler-rt.
          export RUSTFLAGS="-C link-arg=-fapple-link-rtlib"
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-rpath,@executable_path"
          fi
          cargo build --release --target ${{ matrix.target }} -p asone -p asone-cli 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          otool -L target/${{ matrix.target }}/release/asone
      - name: Końcówka logu (przy błędzie)
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          clean="$RUNNER_TEMP/build-clean.log"
          sed 's/\x1b\[[0-9;]*m//g; s/\r//g' "$f" > "$clean"
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=Błędy z logu::$(grep -E '^error|error\[|[Ee]rror:|ERROR|failed|panicked|Undefined symbols|referenced from|ld: |^ +"?_' "$clean" | grep -v 'ld: warning' | tail -n 60 | enc)"
          echo "::error title=Końcówka logu::$(grep -v 'ld: warning' "$clean" | tail -n 60 | enc)"
          echo "::error title=Dysk::$(df -h . | tail -n 1)"
      - name: AsOne.app (ZIP)
        run: packaging/macos/bundle.sh ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  freebsd:
    name: FreeBSD x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Budowanie w maszynie FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 12288
          prepare: pkg install -y curl git pkgconf
          run: |
            set -e
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release -p asone -p asone-cli
            V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            mkdir -p dist
            tar czf "dist/AsOne-$V-freebsd-x86_64.tar.gz" -C target/release asone asone-cli
      - uses: actions/upload-artifact@v5
        with:
          name: freebsd-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Android (APK, GameActivity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      # libasone_app.so dla arm64-v8a i x86_64, strony 16 KB (Android 15+), bez symboli.
      - name: Biblioteki natywne (cargo ndk)
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p asone --lib 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      # Powłoka Kotlin (GameActivity) + podpis stałym kluczem z sekretów (bez nich – klucz debug).
      - name: APK (Gradle)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export ASONE_KEYSTORE="$RUNNER_TEMP/release.p12" ASONE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          else
            echo "::warning title=Android::Brak sekretu ANDROID_KEYSTORE_BASE64 – APK podpisany kluczem debug."
          fi
          gradle() { (cd android && ./gradlew assembleRelease --no-daemon --console=plain "$@") 2>&1 | tee -a "$RUNNER_TEMP/build.log"; }
          # Maven Central bywa chwilowo niedostępny („Could not find …”) – druga próba po minucie.
          gradle || { echo "::warning title=Gradle::błąd pobierania zależności – druga próba"; sleep 60; gradle --refresh-dependencies; }
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/AsOne-$V-android.apk"
      - name: Końcówka logu (przy błędzie)
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          clean="$RUNNER_TEMP/build-clean.log"
          sed 's/\x1b\[[0-9;]*m//g; s/\r//g' "$f" > "$clean"
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=Błędy z logu::$(grep -E '^error|error\[|[Ee]rror:|ERROR|failed|panicked|Undefined symbols|referenced from|ld: |^ +"?_' "$clean" | grep -v 'ld: warning' | tail -n 60 | enc)"
          echo "::error title=Końcówka logu::$(grep -v 'ld: warning' "$clean" | tail -n 60 | enc)"
          echo "::error title=Dysk::$(df -h . | tail -n 1)"
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  web:
    name: Web (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.22.2/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Budowanie
        run: |
          set -o pipefail
          (cd apps/asone && trunk build --release) 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          (cd dist/web && zip -qr "../AsOne-$V-web.zip" .)
      - name: Końcówka logu (przy błędzie)
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          clean="$RUNNER_TEMP/build-clean.log"
          sed 's/\x1b\[[0-9;]*m//g; s/\r//g' "$f" > "$clean"
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=Błędy z logu::$(grep -E '^error|error\[|[Ee]rror:|ERROR|failed|panicked|Undefined symbols|referenced from|ld: |^ +"?_' "$clean" | grep -v 'ld: warning' | tail -n 60 | enc)"
          echo "::error title=Końcówka logu::$(grep -v 'ld: warning' "$clean" | tail -n 60 | enc)"
          echo "::error title=Dysk::$(df -h . | tail -n 1)"
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Wydanie na GitHubie
    needs: [linux, windows, macos, freebsd, android, web]
    # Tylko dla tagu lub uruchomienia ręcznego; publikuj to, co się zbudowało,
    # nawet gdy któraś platforma zawiodła.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Sumy kontrolne
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AsOne ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Edytor zdjęć produktowych: kadr, marginesy, białe tło, usuwanie tła AI, nazwy Nazwa-MARKA-Model-1.jpg, Progressive JPEG bez metadanych.

            | System | Plik |
            |---|---|
            | Linux x86_64 / aarch64 | `.AppImage` (uruchom), `.flatpak` (`flatpak install --user AsOne-….flatpak`), `.tar.gz` (same binarki `asone` + `asone-cli`) |
            | Windows x86_64 / ARM64 | `.zip` – rozpakuj i uruchom `asone.exe` |
            | macOS Apple Silicon / Intel | `.zip` z `AsOne.app` |
            | FreeBSD x86_64 | `.tar.gz` (usuwanie tła tylko online – RMBG-3.0 przez fal.ai; edycja AI przez Replicate) |
            | Android (arm64, x86_64) | `-android.apk` – wybór zdjęć z Galerii, zapis do Galerii (Pictures/AsOne); aktualizacje także z repozytorium F-Droid: https://lucasterg.github.io/AsOne/ |
            | Przeglądarka | online: https://lucasterg.github.io/AsOne/app/ albo `-web.zip` – pliki do wrzucenia na serwer WWW (WebGPU / WebGL2; nie działa otwarte prosto z dysku) |

            Programy nie są podpisane certyfikatami Microsoft ani Apple:
            * Windows (SmartScreen): „Więcej informacji” › „Uruchom mimo to”.
            * macOS: po pierwszej próbie Ustawienia systemowe › Prywatność i ochrona › „Otwórz mimo to” (albo `xattr -dr com.apple.quarantine AsOne.app`). Wymagany macOS 13 (Intel) lub 13.4 (Apple Silicon) albo nowszy.

            Modele usuwania tła (BRIA RMBG) pobiera się w programie: Ustawienia › Preferencje › Usuwanie tła (AI).
            `SHA256SUMS.txt` – sumy kontrolne plików.

  fdroid:
    name: GitHub Pages (F-Droid, wersja web)
    needs: [android, web, release]
    # Przy wydaniu (tag / ręcznie), gdy APK się zbudował; wersja web – jeśli też się zbudowała.
    if: ${{ !cancelled() && needs.android.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: fdroid-gh-pages
      cancel-in-progress: false
    env:
      APK_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Indeks repozytorium: osobny klucz FDROID_*, a bez niego – klucz APK.
      KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Sekrety
        id: keys
        run: |
          if [ -z "$APK_KEYSTORE" ] || [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning title=F-Droid::Brak sekretów ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD – repozytorium F-Droid pominięte (APK bez stałego podpisu nie zaktualizuje się w F-Droid)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v5
        if: steps.keys.outputs.skip != '1'
        with:
          name: android
          path: apk
      # fdroidserver z PyPI (androguard 4): wersja z Ubuntu 24.04 (2.2.1, androguard 3) nie czyta
      # tablicy zasobów z APK budowanych przez AGP 9 („res1 must be zero!”).
      - name: fdroidserver i JDK 21
        if: steps.keys.outputs.skip != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openjdk-21-jdk-headless apksigner qrencode python3-venv
          python3 -m venv "$RUNNER_TEMP/fdroidserver"
          "$RUNNER_TEMP/fdroidserver/bin/pip" install -q "fdroidserver==2.4.5"
          echo "$RUNNER_TEMP/fdroidserver/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v5
        if: steps.keys.outputs.skip != '1' && needs.web.result == 'success'
        with:
          name: web
          path: webzip
      - name: Wersja web (app/)
        if: steps.keys.outputs.skip != '1' && needs.web.result == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/web"
          unzip -q webzip/*.zip -d "$RUNNER_TEMP/web"
          echo "WEB_DIR=$RUNNER_TEMP/web" >> "$GITHUB_ENV"
      - name: Aktualizacja strony na gh-pages
        if: steps.keys.outputs.skip != '1'
        run: packaging/fdroid/update-repo.sh apk/*.apk
