          var m = (localStorage.getItem("asone-settings") || "").match(/theme\s*:\s*(\w+)/);

            var k = m[1];
            t = k === "Sepia" ? "sepia"
              : /^(ProLightGray|ProLight|StudioLight|Classic|Adwaita|BreezeLight|SoftLight)$/.test(k) ? "light" : "dark";
          }
        }
        if (t === "light" || t === "jasny") document.documentElement.className = "theme-light";
        else if (t === "sepia") document.documentElement.className = "theme-sepia";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = t === "sepia" ? "#e8dcc4" : (t === "light" || t === "jasny") ? "#f4f4f5" : "#1e1e1e";
      } catch (_) {}
    })();
  </script>
